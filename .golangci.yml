version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  exclusions:
    presets:
      - std-error-handling
formatters:
  enable:
    - gofmt
    - goimports
